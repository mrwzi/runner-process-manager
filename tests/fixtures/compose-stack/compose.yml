services:
  backend:
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 1s
      timeout: 1s
      retries: 2
  web:
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    depends_on:
      backend:
        condition: service_healthy
  bot:
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
